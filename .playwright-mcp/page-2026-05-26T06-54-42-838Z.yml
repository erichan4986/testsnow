  - blockquote [ref=e197]:
    - paragraph [ref=e198]: 初始持仓成本260元，后来在100-130元的区间做过几次波段，90元附近又补了一笔，好不容易把综合成本降到130.79元，现在股价只剩86元，还是被套了33.79%。 【长春高新因果链断裂图】2021年长春高新股价冲到500元，市值突破2000亿，PE高达80倍，当时支撑这个估值的因果链看起来牢不可破：生长激素绝对龙头 → 市占率70%垄断市场 → 毛利率95%堪比茅台 → 医保外自费支付 → 不受集采政策影响 → 业绩永续增长 → 匹配成长股高估值这条链条在当时几乎找不到破绽：核心子公司金赛药业年净利润稳定在45亿以上，盈利能力甚至比白酒龙头还强。 最新财报已经完全验证了这个趋势：2025年年报显示，长春高新归母净利润仅1.55亿元，同比暴跌94%； 所谓的第二曲线不仅没跟上，反而还在持续失血：子公司百克生物2025年净亏损2.63亿元，同比扩大200%以上； 我们可以从三个维度拆解：估值方法 测算结果 核心问题PE法 完全失效 净利润基数太低，静态PE严重失真PB法 约1.4倍（股价86.59元/净资产61.6元）ROE不足1%，安全边际不算厚DCF法（乐观假设）合理市值200-300亿 当前市值350亿，合理偏贵，无安全边际现在的86元根本不是什么黄金坑，是价值陷阱的入口。
  - paragraph [ref=e199]:
    - strong [ref=e200]: 我的判断与分析
    - text: ":"
  - paragraph [ref=e201]:
    - strong [ref=e202]: 推导过程分析
    - text: ： 作者的论证链条清晰且完整。前提假设是“长春高新的投资逻辑因集采而系统性崩溃”。论据包括：集采政策落地时间线（2022年广东联盟、2024年浙江、2025年长效针纳入医保）、价格降幅数据（水针降50%-70%、长效针降75%）、以及财务数据（2025年净利润暴跌94%、2026年Q1成本上升）。推理过程为：集采打破“不受政策影响”的旧假设 → 导致量价齐杀 → 利润崩塌 → 估值体系从成长股切换至价值陷阱。结论是：当前86元并非黄金坑，而是价值陷阱入口，需警惕利润长期低迷导致“越跌越贵”。整个推导逻辑严谨，因果链清晰，从宏观政策到微观财务数据层层递进，没有情绪化口号。
  - paragraph [ref=e203]:
    - strong [ref=e204]: 判断
    - text: ： 论据扎实且可验证。集采政策时间线和降价幅度均为公开信息，财务数据（净利润1.55亿元、ROE不足1%）来自公司年报，数据可信度高。逻辑上，作者精准指出了旧逻辑链中最脆弱的假设（“集采永远不会来”），并展示了该假设破裂后的连锁反应。推理严谨之处在于：不仅指出估值方法失效（PE失真），还通过PB法和DCF法给出了具体测算，并点明了乐观假设（利润恢复至20亿）的风险。唯一潜在漏洞是，作者对“创新管线”的期权价值评估偏保守，但作者自己也承认这是“远水救不了近火”，逻辑上自洽。整体上，这是一篇基于事实和逻辑的深度分析，而非情绪宣泄。
  - paragraph [ref=e205]:
    - strong [ref=e206]: 与市场共识的差异
    - text: ： 这篇帖子的观点比当前市场主流认知更悲观，且提供了新论据。市场共识可能仍停留在“长春高新是生长激素龙头，集采冲击已消化，估值已跌至历史低位，存在修复空间”。但作者明确指出：市场认为的“便宜”建立在“利润能恢复至20亿以上”的乐观假设上，而集采深化、出生人口下滑、新药放量不及预期等X因素可能使利润长期低位徘徊，导致“越跌越贵”。作者提出的市场尚未充分定价的因素包括：1）集采对长效针的冲击（75%降幅）尚未完全反映在股价中；2）创新管线的高研发投入仍在侵蚀当期利润，而非贡献收益；3）公司ROE从25%以上跌至不足1%，资产回报率已彻底丧失吸引力。这些因素使长春高新从“成长股”切换为“价值陷阱”，而市场可能仍以“困境反转”的逻辑在定价。
