  - blockquote [ref=e179]:
    - paragraph [ref=e180]: 莫德纳暴涨 12%：汉坦病毒事件驱动下的 A 股投资逻辑与真龙头梳理5 月 8 日莫德纳宣布启动汉坦病毒疫苗研发，股价单日大涨近 12%，一夜之间市值飙升数百亿，直接点燃了全球资本市场对这个 "冷门病毒" 的关注。 很多人可能对汉坦病毒还比较陌生，但这次荷兰 "洪迪厄斯号" 邮轮暴发的安第斯毒株疫情，确实有其特殊性 ——它是目前唯一已知可人际传播的汉坦病毒，致死率高达 38%-50%，7 人感染 3 人死亡，这个数字足以让市场警惕。 一、先搞清楚：这次事件到底是短期炒作，还是有中长期逻辑？ 虽然目前传播能力还不强，但高致死率意味着一旦出现输入性病例，必然会引发大规模的排查和防控需求。 政府防控投入会显著增加：经历过新冠疫情后，各国政府对突发公共卫生事件的重视程度空前提高。 所以我的判断是：这次不会演变成新冠那样的大级别行情，但会是一个持续 1-3 个月的事件驱动型机会。 其中，业绩确定性最强的是检测和消杀板块，疫苗和抗病毒药物板块则更多是技术储备层面的中长期逻辑。 如果海外疫情进一步扩散，公司的快速检测产品出口弹性最大。 如果未来需要开发针对安第斯毒株的 mRNA 疫苗，它们无疑会是第一梯队。 $星湖科技(SH600866)$ ：全球最大的利巴韦林原料药生产商，市占率超过 60%，拥有绝对的产能和成本优势。
