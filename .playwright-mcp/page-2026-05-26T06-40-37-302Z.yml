  - paragraph [ref=e123]:
    - strong [ref=e124]: 判断
    - text: ": 这是一篇典型的事件驱动型产业链分析，信息面极广。但长春高新在其中的角色非常边缘——联营企业生产的汉坦病毒疫苗属于传统灭活疫苗，与莫德纳正在研发的mRNA疫苗技术路线不同，且每年仅为疫区数百万高危人群提供免费接种，商业化空间有限。投资者不应将此文视为长春高新的核心看多逻辑，更多是一次\"蹭热点\"式的关联。"
