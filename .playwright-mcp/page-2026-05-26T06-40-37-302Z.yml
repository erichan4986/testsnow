  - blockquote [ref=e133]:
    - paragraph [ref=e134]: 初始持仓成本260元，后来在100-130元的区间做过几次波段，90元附近又补了一笔，好不容易把综合成本降到130.79元，现在股价只剩86元，还是被套了33.79%。 【长春高新因果链断裂图】2021年长春高新股价冲到500元，市值突破2000亿，PE高达80倍，当时支撑这个估值的因果链看起来牢不可破：生长激素绝对龙头 → 市占率70%垄断市场 → 毛利率95%堪比茅台 → 医保外自费支付 → 不受集采政策影响 → 业绩永续增长 → 匹配成长股高估值这条链条在当时几乎找不到破绽：核心子公司金赛药业年净利润稳定在45亿以上，盈利能力甚至比白酒龙头还强。 最新财报已经完全验证了这个趋势：2025年年报显示，长春高新归母净利润仅1.55亿元，同比暴跌94%； 所谓的第二曲线不仅没跟上，反而还在持续失血：子公司百克生物2025年净亏损2.63亿元，同比扩大200%以上； 我们可以从三个维度拆解：估值方法 测算结果 核心问题PE法 完全失效 净利润基数太低，静态PE严重失真PB法 约1.4倍（股价86.59元/净资产61.6元）ROE不足1%，安全边际不算厚DCF法（乐观假设）合理市值200-300亿 当前市值350亿，合理偏贵，无安全边际现在的86元根本不是什么黄金坑，是价值陷阱的入口。
  - paragraph [ref=e135]:
    - strong [ref=e136]: 我的判断与分析
    - text: ":"
  - paragraph [ref=e137]: 站在七楼看世界的帖子是雪球上关于长春高新最深刻的反思之一。作者以自身被套经历为切入点，系统复盘了"长期持有"叙事如何在市场顶部麻痹投资者。
