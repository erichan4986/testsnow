[pytest]
testpaths = tests
markers =
    report_core: fast report-generation, synthesis, renderer, scoring, and risk tests for normal development
    external_material: tests for Agent-Reach, WeChat, broker, periodic, or curated external material flows
    integration: entrypoint, pipeline, chart, PDF, or cross-module integration tests
    slow: tests that may invoke expensive rendering, large fixtures, or broader integration paths
    legacy: historical report/technical phase tests kept for regression reference but excluded from fast loops
